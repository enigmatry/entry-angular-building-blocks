trigger:
- master

# Pull requests into master run the ci_build stage as a validation build. publish_npm is skipped
# for them by its stage condition.
pr:
  branches:
    include:
    - master

variables:
  theLatestVersion: ''
  artifactName: entry-angular-building-blocks
  peerDependencies.@enigmatry/entry-components: $(theLatestVersion)

stages:
- stage: ci_build
  displayName: Build the Angular Building Blocks
  jobs:
  - job: build
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 50
      fetchTags: true

    - template: pipeline-templates/install-node.yml

    - task: DotNetCoreCLI@2
      displayName: Add Manifest for tool installation
      inputs:
        command: 'custom'
        custom: 'new '
        arguments: tool-manifest

    - task: DotNetCoreCLI@2
      displayName: Install minver
      inputs:
        command: 'custom'
        custom: 'tool '
        arguments: install minver-cli

    - task: PowerShell@2
      displayName: 'Set MinVer Version'
      inputs:
        targetType: inline
        script: |
          # The package major follows the Angular major, so MinVer's minimum (-m) is the major of the
          # @angular/core version locked in package-lock.json, which npm ci installs. Until the first
          # release of a new major is tagged, builds come out as <major>.0.0-preview.N instead of a
          # preview of the previous major. After that it has no effect.
          $angularVersion = node -p "require('./package-lock.json').packages['node_modules/@angular/core']?.version"
          if ("$angularVersion" -notmatch '^(\d+)\.\d+\.\d+') { throw "Could not read the locked @angular/core version from package-lock.json (got '$angularVersion')" }
          $angularMajor = $Matches[1]
          $version = dotnet minver -p preview -m "$angularMajor.0"
          echo "##vso[task.setvariable variable=theLatestVersion]$version"
          echo "##vso[build.updatebuildnumber]$version"
          Write-Host "Setting MinVer to '$version'"

    - task: Npm@1
      displayName: 'Set the version for entry form'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/entry-form'

    - task: Npm@1
      displayName: 'Set the version for entry components'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/entry-components'

    - task: Npm@1
      displayName: 'Set the version eslint recommended rules'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/eslint-config'

    - task: Npm@1
      displayName: 'Set the version stylelint recommended rules'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/stylelint-config'

    - task: Npm@1
      displayName: 'Set the version scss foundation'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/scss-foundation'

    - task: Npm@1
      displayName: 'npm ci'
      inputs:
        command: 'ci'

    - task: Npm@1
      displayName: 'Lint libraries'
      inputs:
        command: 'custom'
        customCommand: 'run lint'

    - task: Npm@1
      displayName: 'Build entry components'
      inputs:
        command: 'custom'
        customCommand: 'run build @enigmatry/entry-components'

    - task: Npm@1
      displayName: 'Build entry form'
      inputs:
        command: 'custom'
        customCommand: 'run build @enigmatry/entry-form'

    # deploy-demo.yml generates the API reference and deploys every master merge without approval,
    # so a pull request that breaks typedoc has to fail here, before it reaches master.
    - task: Npm@1
      displayName: 'Generate API reference'
      inputs:
        command: 'custom'
        customCommand: 'run typedoc'

    - task: Npm@1
      displayName: 'Build demo application'
      inputs:
        command: 'custom'
        customCommand: 'run build @enigmatry/demo-app'

    - task: Npm@1
      displayName: 'Run unit tests'
      inputs:
        command: 'custom'
        customCommand: 'run automated-tests'

    - task: FileTransform@2
      displayName: 'File transformation: package.json'
      inputs:
        folderPath: 'dist'
        jsonTargetFiles: '**/package.json'
        xmlTransformationRules:

    - task: PublishBuildArtifacts@1
      displayName: Publish artifacts
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: $(artifactName)-$(Build.BuildNumber)
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      displayName: Publish libs
      inputs:
        PathtoPublish: 'libs'
        ArtifactName: $(artifactName)-$(Build.BuildNumber)
        publishLocation: 'Container'

- stage: publish_npm
  dependsOn: ci_build
  # Only master and release/<major> publish. A pull request (refs/pull/...) or a manual run on any other
  # branch finishes green after ci_build instead of waiting at the npm approval gate, where approving
  # would publish that branch.
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))
  displayName: Publish to NPM
  jobs:
  - deployment: Deploy
    environment: npm
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 50
              fetchTags: true
            - download: current
              displayName: 'Download build artifacts'

            # Same Node pin as the build. Its npm 11 also refuses to publish a pre-release without an
            # explicit tag, so a publish step that loses its tag fails instead of moving `latest`.
            - template: pipeline-templates/install-node.yml

            # Without a tag npm moves `latest` - what a plain install resolves to - onto whatever was
            # published last, previews included. The current major publishes pre-releases to `next`
            # and releases to `latest`. An older major - a release/<major> branch cut from master
            # inherits this file - goes to `v<major>-next` and `v<major>-lts` instead, so it can never
            # move `latest` back. Every publish step below receives the tag as npm_config_tag.
            - bash: |
                set -euo pipefail
                version=$(node -p "require('./package.json').version")
                if [[ ! "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+ ]]; then echo "Unexpected package version '$version'"; exit 1; fi
                major=${BASH_REMATCH[1]}
                latest=$(npm view @enigmatry/entry-components dist-tags.latest)
                if [[ ! "$latest" =~ ^([0-9]+)\. ]]; then echo "Could not read the current latest version from npm (got '$latest')"; exit 1; fi
                latestMajor=${BASH_REMATCH[1]}
                if (( major < latestMajor )); then
                  if [[ "$version" == *-* ]]; then tag="v${major}-next"; else tag="v${major}-lts"; fi
                else
                  if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
                fi
                # A build approved late at the npm gate must not move a tag backwards, e.g. 22.2.1
                # after 22.3.0 is already `latest`. The explicit tag skips npm's own check for that.
                current=$(npm view @enigmatry/entry-components "dist-tags.$tag")
                if [[ -n "$current" && "$current" != "$version" ]]; then
                  newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
                  if [[ "$newest" != "$version" ]]; then
                    echo "Refusing to move '$tag' back from $current to $version. This build is older than what is already published; cancel it."
                    exit 1
                  fi
                fi
                echo "Publishing $version under the npm dist-tag '$tag' (npm latest is $latest)"
                echo "##vso[task.setvariable variable=npmDistTag]$tag"
              displayName: 'Choose the npm dist-tag'
              workingDirectory: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-components'

            - task: Npm@1
              displayName: 'Publish entry components'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-components'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish entry form'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-form'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the eslint recommended rules'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/eslint-config'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the stylelint recommended rules'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/stylelint-config'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the scss foundation'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/scss-foundation'
              env:
                npm_config_tag: $(npmDistTag)
