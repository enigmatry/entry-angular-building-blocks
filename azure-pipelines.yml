trigger:
- master

# no PR triggers
pr: none

variables:
  theLatestVersion: ''
  artifactName: entry-angular-building-blocks
  peerDependencies.@enigmatry/entry-components: $(theLatestVersion)

stages:
- stage: ci_build
  displayName: Build the Angular Building Blocks
  jobs:
  - job: build
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 50
      fetchTags: true

    # Pinned so the build does not depend on whichever Node ubuntu-latest ships. Node 24 is inside
    # Angular 21's engine range, and its npm 11 refuses a pre-release publish without a tag.
    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '^24.15.0'

    - task: DotNetCoreCLI@2
      displayName: Add Manifest for tool installation
      inputs:
        command: 'custom'
        custom: 'new '
        arguments: tool-manifest

    - task: DotNetCoreCLI@2
      displayName: Install minver
      inputs:
        command: 'custom'
        custom: 'tool '
        arguments: install minver-cli

    - task: PowerShell@2
      displayName: 'Set MinVer Version'
      inputs:
        targetType: inline
        script: |
          $version = dotnet minver -p preview
          echo "##vso[task.setvariable variable=theLatestVersion]$version"
          echo "##vso[build.updatebuildnumber]$version"
          Write-Host "Setting MinVer to '$version'"

    - task: Npm@1
      displayName: 'Set the version for entry form'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/entry-form'

    - task: Npm@1
      displayName: 'Set the version for entry components'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/entry-components'

    - task: Npm@1
      displayName: 'Set the version eslint recommended rules'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/eslint-config'

    - task: Npm@1
      displayName: 'Set the version stylelint recommended rules'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/stylelint-config'

    - task: Npm@1
      displayName: 'Set the version scss foundation'
      inputs:
        command: custom
        customCommand: version $(theLatestVersion) --no-git-tag-version
        workingDir: 'libs/scss-foundation'

    - task: Npm@1
      displayName: 'npm ci'
      inputs:
        command: 'ci'

    - task: Npm@1
      displayName: 'Lint libraries'
      inputs:
        command: 'custom'
        customCommand: 'run lint'

    - task: Npm@1
      displayName: 'Build entry components'
      inputs:
        command: 'custom'
        customCommand: 'run build @enigmatry/entry-components'

    - task: Npm@1
      displayName: 'Build entry form'
      inputs:
        command: 'custom'
        customCommand: 'run build @enigmatry/entry-form'

    - task: Npm@1
      displayName: 'Run unit tests'
      inputs:
        command: 'custom'
        customCommand: 'run automated-tests'

    - task: FileTransform@2
      displayName: 'File transformation: package.json'
      inputs:
        folderPath: 'dist'
        jsonTargetFiles: '**/package.json'
        xmlTransformationRules:

    - task: PublishBuildArtifacts@1
      displayName: Publish artifacts
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: $(artifactName)-$(Build.BuildNumber)
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      displayName: Publish libs
      inputs:
        PathtoPublish: 'libs'
        ArtifactName: $(artifactName)-$(Build.BuildNumber)
        publishLocation: 'Container'

- stage: publish_npm
  dependsOn: ci_build
  displayName: Publish to NPM
  jobs:
  - deployment: Deploy
    environment: npm
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 50
              fetchTags: true
            - download: current
              displayName: 'Download build artifacts'

            - task: UseNode@1
              displayName: 'Install Node.js'
              inputs:
                version: '^24.15.0'

            # Without a tag npm moves `latest` - what a plain install resolves to - onto whatever was
            # published last. A release from this branch takes `latest` only while 21 is still the
            # newest major on npm. Once a newer major is `latest` it goes to `v21-lts`, and a
            # pre-release always goes to `v21-next`, so neither can move `latest` back to 21.
            - bash: |
                set -euo pipefail
                version=$(node -p "require('./package.json').version")
                major=${version%%.*}
                if [[ "$version" == *-* ]]; then
                  tag="v${major}-next"
                else
                  latest=$(npm view @enigmatry/entry-components dist-tags.latest)
                  if [[ -z "$latest" ]]; then echo "Could not read the current latest version from npm"; exit 1; fi
                  if (( ${latest%%.*} > major )); then tag="v${major}-lts"; else tag=latest; fi
                fi
                echo "Publishing $version under the npm dist-tag '$tag'"
                echo "##vso[task.setvariable variable=npmDistTag]$tag"
              displayName: 'Choose the npm dist-tag'
              workingDirectory: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-components'

            - task: Npm@1
              displayName: 'Publish entry components'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-components'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish entry form'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/enigmatry/entry-form'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the eslint recommended rules'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/eslint-config'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the stylelint recommended rules'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/stylelint-config'
              env:
                npm_config_tag: $(npmDistTag)

            - task: Npm@1
              displayName: 'Publish the scss foundation'
              inputs:
                command: publish
                publishRegistry: useExternalRegistry
                publishEndpoint: npm
                workingDir: '$(Pipeline.Workspace)/$(artifactName)-$(Build.BuildNumber)/scss-foundation'
              env:
                npm_config_tag: $(npmDistTag)
