<mat-form-field class="date-time-search-field" subscriptSizing="dynamic">
    <mat-label [attr.for]="searchFilter().key">{{searchFilter().label}}</mat-label>
    <input matInput [formField]="field()" [matDatepicker]="picker" [id]="searchFilter().key">
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
    <mat-datepicker #picker />
    @for (error of field()().errors(); track $index) {
        <mat-error>{{error.message}}</mat-error>
    }
</mat-form-field>
