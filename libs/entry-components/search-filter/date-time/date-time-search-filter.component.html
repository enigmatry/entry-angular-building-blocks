<mat-form-field class="date-time-search-field" subscriptSizing="dynamic" [formGroup]="form()">
    <mat-label [attr.for]="searchFilter().key">{{searchFilter().label}}</mat-label>
    <input matInput [formControlName]="searchFilter().key" [matDatepicker]="picker" [id]="searchFilter().key">
    <mat-datepicker-toggle matIconSuffix [for]="picker" />
    <mat-datepicker #picker />
    <mat-error entryDisplayControlValidation [control]="form().get(searchFilter().key)!" />
</mat-form-field>
