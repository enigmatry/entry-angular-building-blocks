<form class="search-form-container entry-form" [formGroup]="searchFilterForm()" (ngSubmit)="onSubmit()">
    <entry-form-errors [form]="searchFilterForm()" />
    @for (searchFilter of renderedSearchFilters(); track searchFilter.key) {
        <div class="form-field">
            @switch (searchFilter.controlType) {
                @case (controlType.text) {
                    <entry-text-search-filter [searchFilter]="asTextSearchFilter(searchFilter)" [form]="searchFilterForm()" />
                }
                @case (controlType.select) {
                    <entry-select-search-filter [searchFilter]="asSelectSearchFilter(searchFilter)" [form]="searchFilterForm()" />
                }
                @case (controlType.autocomplete) {
                    <entry-autocomplete-search-filter [searchFilter]="asAutocompleteSearchFilter(searchFilter)" />
                }
                @case (controlType.dateTime) {
                    <entry-date-time-search-filter [searchFilter]="asDateTimeSearchFilter(searchFilter)" [form]="searchFilterForm()" />
                }
                @case (controlType.date) {
                    <entry-date-search-filter [searchFilter]="asDateSearchFilter(searchFilter)" [form]="searchFilterForm()" />
                }
            }
        </div>
    }
    <div class="entry-search-filter-actions">
        <button mat-button entry-submit-button>
            <span>{{config.applyButtonText}}</span>
        </button>
    </div>
</form>
