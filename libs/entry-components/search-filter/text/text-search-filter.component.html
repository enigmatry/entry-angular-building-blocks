<mat-form-field subscriptSizing="dynamic" [formGroup]="form()">
    <mat-label [attr.for]="searchFilter().key">{{searchFilter().label}}</mat-label>
    <input matInput [formControlName]="searchFilter().key" [id]="searchFilter().key" [type]="searchFilter().type"
        [placeholder]="searchFilter().placeholder" [maxlength]="searchFilter().maxLength">
    <mat-error entryDisplayControlValidation [control]="form().get(searchFilter().key)!" />
</mat-form-field>
