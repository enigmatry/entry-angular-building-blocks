<mat-form-field subscriptSizing="dynamic">
    <mat-label [attr.for]="searchFilter().key">{{searchFilter().label}}</mat-label>
    <input #textInput matInput [formField]="field()" [id]="searchFilter().key" [type]="searchFilter().type"
        [placeholder]="searchFilter().placeholder" (input)="applyMask(textInput)">
    @for (error of field()().errors(); track $index) {
        <mat-error>{{error.message}}</mat-error>
    }
</mat-form-field>
