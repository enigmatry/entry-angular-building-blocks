<div class="entry-dialog" role="dialog">
    <div class="dialog-header">
        <h1 class="title" mat-dialog-title [class.without-close-icon]="hideClose()">{{ title() }}</h1>
        @if (!hideClose()) {
            <button mat-icon-button type="button" class="close-button" aria-label="Close dialog"
                (click)="onCancel()">
                <mat-icon aria-hidden="true">close</mat-icon>
            </button>
        }
    </div>

    <mat-dialog-content class="dialog-content" [class.with-actions]="!hideButtons()">
        <ng-content />
    </mat-dialog-content>

    @if (!hideButtons()) {
        <mat-dialog-actions class="dialog-actions" [align]="buttonsAlignment()">
                @if(buttonsTemplate()) {
                    <ng-container [ngTemplateOutlet]="buttonsTemplate()!" />
                }

                @else {
                    <ng-container [ngTemplateOutlet]="defaultButtonsTemplate" />
                }
        </mat-dialog-actions>
    }

    <ng-template #defaultButtonsTemplate>
        <button cdkFocusInitial mat-button entry-submit-button type="button" [disabled]="disableConfirm()" (click)="onSubmit()">
            <span>{{confirmButtonText()}}</span>
        </button>
        @if (!hideCancel()) {
            <button mat-button entry-cancel-button type="button" (click)="onCancel()">
                <span>{{cancelButtonText()}}</span>
            </button>
        }
    </ng-template>
</div>
