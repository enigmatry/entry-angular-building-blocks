<div class="entry-dialog">
    <div class="dialog-header">
        <h2 class="title" mat-dialog-title [class.without-close-icon]="hideClose()">{{ title() }}</h2>
        @if (!hideClose()) {
            <button mat-icon-button type="button" class="close-button" [attr.aria-label]="config.closeButtonLabel"
                (click)="cancel()">
                <mat-icon aria-hidden="true">close</mat-icon>
            </button>
        }
    </div>

    <mat-dialog-content class="dialog-content" [class.with-actions]="!hideButtons()">
        <ng-content />
    </mat-dialog-content>

    @if (!hideButtons()) {
        <mat-dialog-actions class="dialog-actions" [align]="buttonsAlignment()">
            @if (buttonsTemplate(); as buttons) {
                <ng-container [ngTemplateOutlet]="buttons" />
            } @else {
                <ng-container [ngTemplateOutlet]="defaultButtonsTemplate" />
            }
        </mat-dialog-actions>
    }

    <ng-template #defaultButtonsTemplate>
        <button cdkFocusInitial mat-button entry-submit-button type="submit" disabledInteractive [disabled]="disableConfirm()"
            (click)="confirm($event)">
            <span>{{confirmButtonText()}}</span>
        </button>
        @if (!hideCancel()) {
            <button mat-button entry-cancel-button type="button" (click)="cancel()">
                <span>{{cancelButtonText()}}</span>
            </button>
        }
    </ng-template>
</div>
