<entry-dialog
    [title]="dialog.data.title"
    [confirmButtonText]="dialog.data.confirmText ?? config.confirmButtonText"
    [buttonsAlignment]="dialog.data.buttonsAlignment ?? config.buttonsAlignment"
    [hideClose]="dialog.data.hideClose ?? config.hideClose"
    [hideCancel]="true"
    (confirmed)="dialog.close(true)">
    @if (dialog.data.message) {
        <p>{{dialog.data.message}}</p>
    }
    @for (error of errors; track $index) {
        <p>{{error}}</p>
    }
</entry-dialog>
