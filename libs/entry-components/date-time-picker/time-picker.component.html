<mat-form-field appearance="fill">
  <mat-select [hideSingleSelectionIndicator]="true" [panelWidth]="null" [(value)]="hours">
    @for (hour of possibleHours(); track hour) {
      <mat-option [value]="hour">{{hour | number:'2.0'}}</mat-option>
    }
  </mat-select>
</mat-form-field>
<span class="time-separator">&#58;</span>
<mat-form-field appearance="fill">
  <mat-select [hideSingleSelectionIndicator]="true" [panelWidth]="null" [(value)]="minutes">
    @for (minute of sixty; track minute) {
      <mat-option [value]="minute">{{minute | number:'2.0'}}</mat-option>
    }
  </mat-select>
</mat-form-field>
@if (showSeconds()) {
  <span class="time-separator">&#58;</span>
  <mat-form-field appearance="fill">
    <mat-select [hideSingleSelectionIndicator]="true" [panelWidth]="null" [(value)]="seconds">
      @for (second of sixty; track second) {
        <mat-option [value]="second">{{second | number:'2.0'}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
}
@if (is12HourClock()) {
  <mat-form-field appearance="fill">
    <mat-select [hideSingleSelectionIndicator]="true" [panelWidth]="null" [(value)]="meridiem">
      <mat-option value="am">AM</mat-option>
      <mat-option value="pm">PM</mat-option>
    </mat-select>
  </mat-form-field>
}
