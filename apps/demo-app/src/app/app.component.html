<div class="docs-main">
  <mat-toolbar class="docs-header">
    <div class="doc-navigation">
      <img class="logo header-element" src="assets/images/entry_logo_small_transparent_material.png" alt="Entry logo">
      <button mat-flat-button color="primary" type="button" class="header-element" routerLink="">
        Components
      </button>
      @if (selectedMenuItem()) {
        <span class="header-element"> {{selectedMenuItem()?.label}}</span>
      }
    </div>

    <a mat-flat-button color="primary" target="_blank" class="header-element"
      href="https://github.com/enigmatry/entry-angular-building-blocks">
      <img class="github-icon" src="assets/images/github-circle-white-transparent.svg" alt="View Enigmatry source code repository"/>
      <span class="github-description">GitHub</span>
    </a>
  </mat-toolbar>

  <mat-sidenav-container class="docs-container">
    <mat-sidenav mode="side" class="docs-sidenav" [opened]="true">
      <mat-nav-list class="docs-menu-items">
        @for (item of (menuItems | sort); track item.route) {
          <a mat-list-item routerLinkActive="active" class="docs-menu-item"
            [routerLink]="item.route">
            {{item.label}}
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
