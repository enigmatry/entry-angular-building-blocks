<form class="reactive-form entry-form" [formGroup]="form" (ngSubmit)="submitForm()">
    <mat-form-field class="example-form-field">
        <mat-label>First name</mat-label>
        <input matInput type="text" formControlName="firstName">
        <!-- Displays field level validation errors -->
        <mat-error entryDisplayControlValidation [control]="form.controls.firstName" />
    </mat-form-field>
    <mat-form-field class="example-form-field">
        <mat-label>Last name</mat-label>
        <input matInput type="text" formControlName="lastName">
        <!-- Displays field level validation errors -->
        <mat-error entryDisplayControlValidation [control]="form.controls.lastName" />
    </mat-form-field>

    <!-- Displays form level validation errors -->
    <entry-form-errors [form]="form" />

    <div class="action-buttons">
        <button mat-button entry-submit-button type="submit">Submit</button>
        <button mat-button entry-cancel-button type="reset" (click)="reset()">Reset</button>
    </div>
</form>
<br/>
<p>
    Validation error response (<em>IValidationProblemDetails</em>): 
</p>
<pre><code>{{validationResult() | json}}</code></pre>
