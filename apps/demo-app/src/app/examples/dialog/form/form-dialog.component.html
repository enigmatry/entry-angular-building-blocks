<!-- Saving from the form's ngSubmit reads the committed values; the confirm button submits it, and so does Enter in a field -->
<form [formGroup]="form" (ngSubmit)="save()">
    <entry-dialog title="Edit name" [hideClose]="false" [disableConfirm]="dialog.submitting()">
        <div class="stack-vertical">
            <mat-form-field>
                <mat-label>First name</mat-label>
                <input cdkFocusInitial matInput type="text" formControlName="firstName">
                <mat-error entryDisplayControlValidation [control]="form.controls.firstName" />
            </mat-form-field>
            <mat-form-field>
                <mat-label>Last name</mat-label>
                <input matInput type="text" formControlName="lastName">
                <mat-error entryDisplayControlValidation [control]="form.controls.lastName" />
            </mat-form-field>
            <entry-form-errors [form]="form" />
        </div>
    </entry-dialog>
</form>
