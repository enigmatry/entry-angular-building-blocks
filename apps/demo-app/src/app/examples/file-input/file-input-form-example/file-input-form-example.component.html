<p>
  <entry-file-input 
    accept="image/*"
    label="Template driven" 
    [(ngModel)]="selectedFile" />
</p>

<p>
  <entry-file-input 
    accept="image/*" 
    label="Form control" 
    [formControl]="standaloneControl" />
</p>

<form [formGroup]="form">
  <entry-file-input 
    accept="image/*" 
    label="Reactive driven" 
    formControlName="file" />
</form>
